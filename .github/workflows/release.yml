name: Release Desktop Installers

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies (Tauri CLI)
        run: npm install

      - name: Install game dependencies
        working-directory: xingling-game
        run: npm ci

      - name: Build Windows installer
        run: npx tauri build --verbose

      - name: Publish Windows installer
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe

  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install root dependencies (Tauri CLI)
        run: npm install

      - name: Install game dependencies
        working-directory: xingling-game
        run: npm ci

      - name: Build Linux AppImage
        run: npx tauri build --verbose --bundles appimage

      - name: Publish Linux AppImage
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: src-tauri/target/release/bundle/appimage/*.AppImage
