name: Build Windows Installer

on:
  push:
    branches: [feat/windows-client]
    tags: ["v*"]
    paths:
      - "src-tauri/**"
      - "xingling-game/**"
      - "package.json"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            src-tauri/target
            ~/.cargo/registry
            ~/.cargo/git
          key: windows-cargo-${{ hashFiles('src-tauri/Cargo.toml', 'src-tauri/Cargo.lock') }}
          restore-keys: windows-cargo-

      - name: Install root dependencies (Tauri CLI)
        run: npm install

      - name: Install game dependencies
        working-directory: xingling-game
        run: npm ci

      - name: Build Tauri app
        run: npx tauri build --verbose

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: xingling-windows-installer
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
